schema_version: "1.1"
name: checks-time-sensitive-claim
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The assistant uses the saved profile without re-running setup. Before presenting any
  result it searches the web to check the person's claims that can change over time,
  in particular the MEI annual revenue limit and the state of the official invoice
  issuer, and reports each as current, outdated with the correction, or unverifiable,
  with source and date. Findings are written to docs/discovery/findings.md with
  volatility, freshness and check date. Results are shown as tables because the person
  asked for tables. No plan, spec or handoff is written, and nothing is written under .specs/features.
